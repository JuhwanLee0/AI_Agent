<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Company - Live Operations Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #e2e8f0; padding: 24px; }
        .container { max-width: 1000px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 16px; margin-bottom: 24px; }
        h1 { font-size: 24px; font-weight: 700; color: #38bdf8; }
        .badge { background: #0369a1; color: #fff; padding: 4px 12px; border-radius: 9999px; font-size: 13px; font-weight: 600; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        .progress-bar-bg { background: #334155; height: 12px; border-radius: 6px; overflow: hidden; margin-top: 10px; }
        .progress-bar-fill { background: linear-gradient(90deg, #38bdf8, #818cf8); height: 100%; width: 0%; transition: width 0.5s ease; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
        .agent-card { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
        .agent-header { display: flex; justify-content: space-between; align-items: center; }
        .agent-name { font-weight: 600; font-size: 16px; color: #f8fafc; }
        .agent-status { font-size: 12px; padding: 2px 8px; border-radius: 4px; font-weight: 600; }
        .status-idle { background: #334155; color: #94a3b8; }
        .status-working { background: #0284c7; color: #ffffff; animation: pulse 2s infinite; }
        .status-done { background: #166534; color: #86efac; }
        .task-desc { font-size: 13px; color: #cbd5e1; line-height: 1.4; flex-grow: 1; }
        .updated-at { font-size: 11px; color: #64748b; text-align: right; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>AI Virtual Company Monitor</h1>
            <span class="badge" id="activeAgent">Active: None</span>
        </header>

        <div class="card">
            <h2 style="font-size: 16px; color: #94a3b8; margin-bottom: 4px;">현재 진행 프로젝트</h2>
            <div id="currentProject" style="font-size: 20px; font-weight: 600;">대기 중</div>
            <div class="progress-bar-bg">
                <div id="progressFill" class="progress-bar-fill"></div>
            </div>
            <div style="display: flex; justify-content: space-between; margin-top: 6px; font-size: 12px; color: #94a3b8;">
                <span>진행률</span>
                <span id="progressText">0%</span>
            </div>
        </div>

        <h2 style="font-size: 18px; margin-bottom: 12px; color: #e2e8f0;">에이전트별 실시간 상태</h2>
        <div class="grid" id="agentsGrid"></div>
    </div>

    <script>
        async function updateStatus() {
            try {
                const res = await fetch('../status.json?t=' + Date.now());
                if (!res.ok) return;
                const data = await res.json();

                document.getElementById('currentProject').innerText = data.current_project || '대기 중';
                document.getElementById('activeAgent').innerText = 'Active: ' + (data.active_agent || 'None');
                
                const percent = data.progress_percent || 0;
                document.getElementById('progressFill').style.width = percent + '%';
                document.getElementById('progressText').innerText = percent + '%';

                const grid = document.getElementById('agentsGrid');
                grid.innerHTML = '';

                for (const [name, info] of Object.entries(data.agents_status || {})) {
                    const card = document.createElement('div');
                    card.className = 'agent-card';

                    let statusClass = 'status-idle';
                    if (info.status === '진행중' || info.status === 'Working') statusClass = 'status-working';
                    else if (info.status === '완료' || info.status === 'Done') statusClass = 'status-done';

                    card.innerHTML = `
                        <div class="agent-header">
                            <span class="agent-name">${name}</span>
                            <span class="agent-status ${statusClass}">${info.status || '대기'}</span>
                        </div>
                        <div class="task-desc">${info.last_task || '-'}</div>
                        <div class="updated-at">${info.updated_at || ''}</div>
                    `;
                    grid.appendChild(card);
                }
            } catch (err) {
                console.error('Status fetch error:', err);
            }
        }

        setInterval(updateStatus, 2000);
        updateStatus();
    </script>
</body>
</html>
