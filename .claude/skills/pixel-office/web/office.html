<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>픽셀 오피스</title>
<style>
  :root{ --bg:#07171a; --floor:#123037; --floor2:#0e262c; --wall:#0a1f24;
         --ink:#dff6f4; --accent:#ffe000; --teal:#1fd9c0; --dim:#5b8a8a; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
  body{font-family:"Pretendard","Malgun Gothic",system-ui,sans-serif;color:var(--ink)}
  #wrap{position:relative;width:100vw;height:100vh}
  canvas{display:block;width:100%;height:100%;image-rendering:pixelated}

  /* ── CCTV 오버레이 (강도 2단: data-cctv="hi" | "lo") ── */
  #cctv{position:absolute;inset:0;pointer-events:none}
  #cctv .scan{position:absolute;inset:0;
    background:repeating-linear-gradient(to bottom,rgba(0,0,0,.20) 0 1px,transparent 1px 3px);
    opacity:var(--scan,.55)}
  #cctv .vig{position:absolute;inset:0;
    background:radial-gradient(ellipse at center,transparent 52%,rgba(0,0,0,.72) 100%);
    opacity:var(--vig,1)}
  #cctv .corner{position:absolute;width:38px;height:38px;border:3px solid rgba(255,255,255,.55)}
  #cctv .tl{top:18px;left:18px;border-right:0;border-bottom:0}
  #cctv .tr{top:18px;right:18px;border-left:0;border-bottom:0}
  #cctv .bl{bottom:18px;left:18px;border-right:0;border-top:0}
  #cctv .br{bottom:18px;right:18px;border-left:0;border-top:0}
  #rec{position:absolute;top:22px;left:70px;display:flex;align-items:center;gap:8px;
       font:700 15px/1 ui-monospace,monospace;letter-spacing:.14em}
  #rec i{width:11px;height:11px;border-radius:50%;background:#ff3b30;animation:blink 1.4s infinite}
  @keyframes blink{0%,45%{opacity:1}55%,100%{opacity:.12}}
  #tc{position:absolute;top:22px;right:70px;font:700 15px/1 ui-monospace,monospace;letter-spacing:.1em;opacity:.9}
  #cam{position:absolute;bottom:24px;left:70px;font:600 13px/1 ui-monospace,monospace;opacity:.75;letter-spacing:.1em}
  #hud{position:absolute;bottom:22px;right:70px;text-align:right;font-size:13px;line-height:1.6;opacity:.9}
  #hud b{color:var(--accent);font-size:20px}
  #ticker{position:absolute;left:70px;bottom:52px;font:600 12px/1.7 ui-monospace,monospace;
          color:var(--teal);opacity:.8;max-width:46vw}
  [data-cctv="lo"] #cctv{--scan:.18;--vig:.45}
  [data-cctv="lo"] #rec,[data-cctv="lo"] #tc,[data-cctv="lo"] #cam{opacity:.35}

  /* ── 직원 카드 (캐릭터 클릭 시) ── */
  #card{position:absolute;right:64px;top:96px;width:min(380px,32vw);
        background:rgba(8,26,30,.96);border:2px solid rgba(31,217,192,.55);
        border-radius:10px;padding:16px 18px 14px;box-shadow:0 10px 30px rgba(0,0,0,.55)}
  #card .nm{font-size:20px;font-weight:800;color:var(--accent);letter-spacing:-.01em}
  #card .rl{margin-top:8px;font-size:14px;line-height:1.65;color:var(--ink);opacity:.92}
  #card dl{margin:14px 0 0;display:grid;gap:7px}
  #card dl>div{display:flex;gap:10px;font-size:12.5px;line-height:1.5}
  #card dt{flex:0 0 42px;color:var(--dim);font-weight:700}
  #card dd{margin:0;color:var(--ink);opacity:.88;word-break:break-all}
  #cardX{position:absolute;right:8px;top:6px;background:none;border:0;
         color:var(--dim);font-size:22px;line-height:1;cursor:pointer}
  #cardX:hover{color:var(--ink)}
  canvas{cursor:pointer}
</style>
</head>
<body data-cctv="hi">
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="cctv">
    <div class="scan"></div><div class="vig"></div>
    <div class="corner tl"></div><div class="corner tr"></div>
    <div class="corner bl"></div><div class="corner br"></div>
  </div>
  <div id="rec"><i></i>REC</div>
  <div id="tc">00:00:00</div>
  <div id="cam">CAM 01 · OFFICE</div>
  <div id="ticker"></div>
  <div id="hud"><b id="n">0</b> / <span id="tot">0</span> 명 근무중<br><span id="zoneline"></span></div>
  <div id="card" hidden>
    <button id="cardX" aria-label="닫기">×</button>
    <div class="nm" id="cName"></div>
    <div class="rl" id="cRole"></div>
    <dl>
      <div><dt>지금</dt><dd id="cNow"></dd></div>
      <div><dt>자리</dt><dd id="cZone"></dd></div>
      <div><dt>정의</dt><dd id="cFile"></dd></div>
    </dl>
  </div>
</div>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){
  DPR = Math.min(2, window.devicePixelRatio||1);
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = W*DPR; cv.height = H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
  layout();
}
addEventListener('resize', resize);

// ── 구역 정의 (비율 좌표) ───────────────────────────
const ZONES = {
  desk:    {x:.06,y:.26,w:.46,h:.56, label:'책상'},
  research:{x:.555,y:.26,w:.255,h:.345, label:'리서치 코너'},
  meeting: {x:.825,y:.26,w:.135,h:.345, label:'회의실'},
  server:  {x:.555,y:.635,w:.185,h:.215, label:'서버랙'},
  lounge:  {x:.755,y:.635,w:.205,h:.215, label:'라운지'},
  waiting: {x:.06,y:.26,w:.46,h:.56, label:'대기'},
  // 버그존은 좌하단 로그 티커와 겹치지 않게 오른쪽으로 뺀다
  error:   {x:.40,y:.86,w:.14,h:.10, label:'버그존'},
};
let Z = {};
function layout(){
  Z = {};
  for(const [k,z] of Object.entries(ZONES))
    Z[k] = {x:z.x*W, y:z.y*H, w:z.w*W, h:z.h*H, label:z.label};
  buildAnchors();
}

// ── 상태 ────────────────────────────────────────────
let org = {agents:[], count:0};
let people = new Map();   // id -> {name,zone,seat,x,y,tx,ty,bob,blink,face}
let logLines = [];
const T0 = performance.now();

// ── 자리 앵커 ──────────────────────────────────────
// 가구를 먼저 고정 배치하고, 사람은 그 가구 자리로 온다.
// (반대로 하면 빈 구역이 텅 비어 "사무실"로 안 읽힌다.)
let ANCHORS = {};
function buildAnchors(){
  const grid = (z, cols, rows, padTop) => {
    const out = [];
    const pt = padTop ?? Math.min(z.h*0.20, 52);
    for(let r=0;r<rows;r++) for(let c=0;c<cols;c++)
      out.push({ x: z.x + z.w*((c+0.5)/cols),
                 y: z.y + pt + (z.h-pt)*((r+0.55)/rows) });
    return out;
  };
  ANCHORS = {
    desk:     grid(Z.desk, 4, 3),
    waiting:  grid(Z.desk, 4, 3),
    research: grid(Z.research, 3, 3),
    meeting:  grid(Z.meeting, 2, 3),
    server:   grid(Z.server, 2, 2),
    lounge:   grid(Z.lounge, 2, 2),
    error:    grid(Z.error, 2, 1, 24),
  };
}
function anchorsFor(zoneKey){ return ANCHORS[zoneKey] || ANCHORS.desk; }
function seatPos(idx, count, zoneKey){
  const a = anchorsFor(zoneKey);
  if(count <= a.length) return { x:a[idx].x, y:a[idx].y, row:0 };
  // ★자리보다 사람이 많으면 겹쳐 세우지 말고 격자를 넓힌다.
  //   (겹치면 이름표가 서로 가려져 "누가 뭘 하는지"를 못 읽는다 = 이 화면의 존재 이유가 무너짐)
  const z = Z[zoneKey] || Z.desk;
  const pt = Math.min(z.h*0.20, 52);
  let cols = Math.max(1, Math.round(Math.sqrt(count * (z.w/Math.max(1,z.h)) * 0.62)));
  cols = Math.min(cols, count);
  const rows = Math.ceil(count/cols);
  const cx = idx % cols, cy = Math.floor(idx/cols);
  return { x: z.x + z.w*((cx+0.5)/cols),
           y: z.y + pt + (z.h-pt)*((cy+0.55)/rows), row: cy };
}

async function poll(){
  try{
    const s = await (await fetch('/state',{cache:'no-store'})).json();
    // 메인 세션(이름 없는 'main')은 직원 수에 넣지 않는다 — 조직도 29명 밖이라
    // 넣으면 "30 / 29 명"처럼 분자가 분모를 넘는 거짓말이 된다.
    document.getElementById('n').textContent = s.workers.filter(w=>w.id!=='main').length;
    document.getElementById('tot').textContent = s.org_count;
    const seen = new Set();
    const zc = {};
    // 구역별로 묶어서 그 안에서의 순번을 준다 (겹침 방지의 핵심)
    const byZone = new Map();
    for(const w of s.workers){
      if(!byZone.has(w.zone)) byZone.set(w.zone, []);
      byZone.get(w.zone).push(w);
    }
    for(const [zoneKey, list] of byZone){
      zc[zoneKey] = list.length;
      list.sort((a,b)=>a.seat-b.seat);
      list.forEach((w, i)=>{
        seen.add(w.id);
        let p = people.get(w.id);
        const tgt = seatPos(i, list.length, w.zone);
        if(!p){
          p = {name:w.name, zone:w.zone, x:tgt.x, y:H*1.05, tx:tgt.x, ty:tgt.y,
               bob:Math.random()*6.28, blink:0, face:1, tool:w.tool, row:tgt.row,
               tunic: tunicFor(w.name), topknot: (w.name.charCodeAt(0)%3===0)};
          people.set(w.id, p);
        }
        p.name=w.name; p.zone=w.zone; p.tool=w.tool; p.row=tgt.row; p.idle=w.idle;
        if(Math.abs(p.tx-tgt.x)>1) p.face = tgt.x>=p.x?1:-1;
        p.tx=tgt.x; p.ty=tgt.y;
      });
    }
    for(const id of [...people.keys()]) if(!seen.has(id)) people.delete(id);
    document.getElementById('zoneline').textContent =
      Object.entries(zc).map(([k,v])=>`${(ZONES[k]||{}).label||k} ${v}`).join(' · ');
    logLines = (s.log||[]).slice(-4).map(l=>`▸ ${l.name||l.id||''} ${l.tool||l.kind||''}`.trim());
    if(selectedId) renderCard();
  }catch(e){}
}
setInterval(poll, 700); poll();

// ── 그리기 ──────────────────────────────────────────
function roomBg(){
  const now = performance.now()/1000;
  const WALL_H = Math.round(H*0.215);   // 뒷벽 높이

  // ── 바닥: 따뜻한 나무 마루 (세로 널 + 이음새) ──
  const g = ctx.createLinearGradient(0, WALL_H, 0, H);
  g.addColorStop(0, '#4a3a2c'); g.addColorStop(1, '#2e241b');
  ctx.fillStyle = g; ctx.fillRect(0, WALL_H, W, H-WALL_H);
  const pw = Math.max(34, Math.round(W/38));
  ctx.globalAlpha = .5;
  for(let x=0; x<W; x+=pw){
    ctx.fillStyle = ((x/pw)|0)%2 ? 'rgba(255,225,190,.045)' : 'rgba(0,0,0,.10)';
    ctx.fillRect(x, WALL_H, pw-2, H-WALL_H);
  }
  ctx.globalAlpha = 1;
  for(let y=WALL_H+pw; y<H; y+=pw*2){       // 널 이음새
    ctx.fillStyle='rgba(0,0,0,.16)'; ctx.fillRect(0, y, W, 2);
  }

  // ── 뒷벽 (두께감 있는 2.5D) ──
  const wg = ctx.createLinearGradient(0,0,0,WALL_H);
  wg.addColorStop(0,'#16323a'); wg.addColorStop(1,'#0e242a');
  ctx.fillStyle = wg; ctx.fillRect(0,0,W,WALL_H);
  ctx.fillStyle='#5a4632'; ctx.fillRect(0, WALL_H-14, W, 14);   // 걸레받이
  ctx.fillStyle='rgba(0,0,0,.35)'; ctx.fillRect(0, WALL_H, W, 10); // 벽 그림자

  // ── 창문 3개: 밤 도시 야경 ──
  const wy = Math.round(H*.045), wh = Math.round(H*.125);
  for(let k=0;k<3;k++){
    const wx = W*(0.06 + k*0.135), ww = W*0.115;
    ctx.fillStyle='#071820'; ctx.fillRect(wx, wy, ww, wh);
    ctx.save(); ctx.beginPath(); ctx.rect(wx, wy, ww, wh); ctx.clip();
    // 빌딩 실루엣 + 창문 불빛
    for(let b=0;b<7;b++){
      const bx = wx + b*(ww/7), bh = wh*(0.30+((b*7+k*3)%5)/9);
      ctx.fillStyle='#0d2730'; ctx.fillRect(bx, wy+wh-bh, ww/7-3, bh);
      for(let r=0;r<4;r++) for(let c=0;c<2;c++){
        if(((b*13+r*5+c*3+k) % 4) === 0) continue;
        ctx.fillStyle = ((b+r+c+k)%6===0) ? 'rgba(255,214,140,.85)' : 'rgba(150,200,220,.28)';
        ctx.fillRect(bx+4+c*8, wy+wh-bh+6+r*9, 5, 6);
      }
    }
    // 흐르는 구름
    for(let i=0;i<2;i++){
      const cx = wx + ((now*9 + i*90 + k*40) % (ww+90)) - 60;
      ctx.fillStyle='rgba(120,170,190,.14)'; ctx.fillRect(cx, wy+8+i*13, 52, 7);
    }
    ctx.restore();
    ctx.strokeStyle='rgba(200,230,235,.30)'; ctx.lineWidth=3;
    ctx.strokeRect(wx, wy, ww, wh);
    ctx.fillStyle='rgba(200,230,235,.22)';
    ctx.fillRect(wx+ww/2-1, wy, 2, wh);         // 창틀 세로살
  }

  // ── 벽면 소품: 시계 · 액자 · 화이트보드 ──
  const cx0 = W*0.50, cy0 = wy+wh*0.42;
  ctx.fillStyle='#e8e6dc'; ctx.beginPath(); ctx.arc(cx0, cy0, 17, 0, 6.3); ctx.fill();
  ctx.strokeStyle='#2b2118'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(cx0, cy0, 17, 0, 6.3); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx0,cy0); ctx.lineTo(cx0+Math.cos(now*0.1-1.57)*11, cy0+Math.sin(now*0.1-1.57)*11); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx0,cy0); ctx.lineTo(cx0+Math.cos(now-1.57)*14, cy0+Math.sin(now-1.57)*14); ctx.stroke();
  const FRAME=['#c2553f','#3f7fa8','#57935f'];
  for(let i=0;i<3;i++){
    const fx = W*(0.60+i*0.075), fy = wy+wh*0.18, fw=W*0.045, fh=wh*0.52;
    ctx.fillStyle='#6b5340'; ctx.fillRect(fx, fy, fw, fh);
    ctx.fillStyle=FRAME[i]; ctx.fillRect(fx+4, fy+4, fw-8, fh-8);
    ctx.fillStyle='rgba(255,255,255,.18)'; ctx.fillRect(fx+4, fy+4, fw-8, (fh-8)*0.4);
  }
}

// ── 조명 ────────────────────────────────────────────
// 따뜻한 빛 웅덩이 하나가 화면 인상을 가장 크게 바꾼다.
function lightPools(){
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const pool = (x,y,r,c,a)=>{
    const g = ctx.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0, `rgba(${c},${a})`); g.addColorStop(1, `rgba(${c},0)`);
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r,0,6.3); ctx.fill();
  };
  const s = Math.max(10, Math.round(W/96));
  // 책상마다 모니터 빛
  (ANCHORS.desk||[]).forEach(a => pool(a.x, a.y - s*1.9, s*3.4, '120,205,235', .16));
  (ANCHORS.server||[]).forEach(a => pool(a.x, a.y - s*1.9, s*2.6, '80,255,170', .12));
  // 천장 조명 (따뜻한 주광)
  for(let i=0;i<4;i++) pool(W*(0.14+i*0.24), H*0.34, W*0.16, '255,200,130', .07);
  ctx.restore();
}
// ── 가구 ────────────────────────────────────────────
// 사무실로 읽히게 하는 건 점선 박스가 아니라 물건이다.
function deskUnit(x, y, s, seed){
  const lit = 0.55 + 0.45*Math.abs(Math.sin(performance.now()/900 + seed));
  // 책상 상판 (원목) + 앞면 + 다리
  ctx.fillStyle='#8a6a4c'; ctx.fillRect(x-s*1.55, y-s*0.10, s*3.10, s*0.34);
  ctx.fillStyle='#6b5137'; ctx.fillRect(x-s*1.55, y+s*0.24, s*3.10, s*0.20);
  ctx.fillStyle='#4a3928'; ctx.fillRect(x-s*1.40, y+s*0.44, s*0.22, s*0.62);
  ctx.fillRect(x+s*1.18, y+s*0.44, s*0.22, s*0.62);
  // 모니터: 받침 → 목 → 베젤 → 화면
  ctx.fillStyle='#2a2f38'; ctx.fillRect(x-s*0.46, y-s*0.20, s*0.92, s*0.12);
  ctx.fillRect(x-s*0.14, y-s*0.52, s*0.28, s*0.34);
  ctx.fillStyle='#1b1f26'; ctx.fillRect(x-s*1.00, y-s*1.62, s*2.00, s*1.14);
  ctx.fillStyle=`rgba(105,205,240,${0.45+0.40*lit})`;
  ctx.fillRect(x-s*0.90, y-s*1.52, s*1.80, s*0.94);
  // 화면 안 코드 줄
  ctx.fillStyle='rgba(255,255,255,.30)';
  for(let r=0;r<4;r++) ctx.fillRect(x-s*0.80, y-s*1.42+r*s*0.22, s*(0.5+((seed+r)%4)*0.28), s*0.09);
  // 키보드 · 머그 · 서류
  ctx.fillStyle='#333944'; ctx.fillRect(x-s*0.72, y-s*0.06, s*1.30, s*0.20);
  ctx.fillStyle='#d0d6dd'; ctx.fillRect(x-s*0.66, y-s*0.02, s*1.18, s*0.06);
  ctx.fillStyle='#cf6b4a'; ctx.fillRect(x+s*0.76, y-s*0.14, s*0.30, s*0.28);
  ctx.fillStyle='#e8e4d8'; ctx.fillRect(x-s*1.42, y-s*0.06, s*0.52, s*0.22);
  // 데스크 램프
  ctx.fillStyle='#5a6270'; ctx.fillRect(x-s*1.34, y-s*0.62, s*0.08, s*0.56);
  ctx.fillStyle='#ffcf7a'; ctx.fillRect(x-s*1.52, y-s*0.76, s*0.44, s*0.18);
}

function shelfUnit(x, y, s){
  ctx.fillStyle='#4a3928'; ctx.fillRect(x-s*1.20, y-s*1.70, s*2.40, s*2.90);
  ctx.fillStyle='#6b5137'; ctx.fillRect(x-s*1.08, y-s*1.58, s*2.16, s*2.66);
  const BOOK=['#c2553f','#3f7fa8','#c8a13f','#57935f','#8a5aa0','#4aa0a8'];
  for(let r=0;r<3;r++){
    ctx.fillStyle='#4a3928';
    ctx.fillRect(x-s*1.08, y-s*0.70+r*s*0.86, s*2.16, s*0.14);
    for(let b=0;b<7;b++){
      ctx.fillStyle=BOOK[(r*7+b)%BOOK.length];
      ctx.fillRect(x-s*1.00+b*s*0.29, y-s*1.44+r*s*0.86, s*0.22, s*0.72);
    }
  }
}

function rackUnit(x, y, s, t){
  ctx.fillStyle='#20242b'; ctx.fillRect(x-s*0.75, y-s*1.5, s*1.5, s*2.7);
  ctx.fillStyle='#171a20';
  for(let r=0;r<7;r++) ctx.fillRect(x-s*0.68, y-s*1.4+r*s*0.36, s*1.36, s*0.28);
  for(let r=0;r<7;r++){
    const on = Math.sin(t*2.2 + r*1.3) > -0.2;
    ctx.fillStyle = on ? '#3dff9e' : '#14402f';
    ctx.fillRect(x-s*0.60, y-s*1.34+r*s*0.36, s*0.14, s*0.14);
    ctx.fillStyle = (r%3===0 && on) ? '#ffcf4d' : '#3a2f16';
    ctx.fillRect(x-s*0.40, y-s*1.34+r*s*0.36, s*0.14, s*0.14);
  }
}
function sofaUnit(x, y, s){
  ctx.fillStyle='#3d4a63'; ctx.fillRect(x-s*1.4, y-s*0.5, s*2.8, s*1.0);
  ctx.fillStyle='#4d5c7a'; ctx.fillRect(x-s*1.4, y-s*0.9, s*2.8, s*0.5);
  ctx.fillStyle='#59688a'; ctx.fillRect(x-s*1.2, y-s*0.45, s*1.1, s*0.5);
  ctx.fillRect(x+s*0.1, y-s*0.45, s*1.1, s*0.5);
  // 낮은 테이블
  ctx.fillStyle='#6b5340'; ctx.fillRect(x-s*0.7, y+s*1.1, s*1.4, s*0.22);
}
function plantUnit(x, y, s){
  ctx.fillStyle='#7a4a33'; ctx.fillRect(x-s*0.34, y+s*0.2, s*0.68, s*0.6);
  ctx.fillStyle='#2f7a4e';
  ctx.fillRect(x-s*0.5, y-s*0.5, s*1.0, s*0.72);
  ctx.fillRect(x-s*0.24, y-s*0.9, s*0.48, s*0.5);
  ctx.fillStyle='#3f9a63'; ctx.fillRect(x-s*0.12, y-s*0.72, s*0.24, s*0.9);
}
function boardUnit(x, y, s, t){
  ctx.fillStyle='#e8e6dc'; ctx.fillRect(x-s*1.7, y-s*1.2, s*3.4, s*2.0);
  ctx.fillStyle='#b9b6aa'; ctx.fillRect(x-s*1.7, y+s*0.8, s*3.4, s*0.14);
  // 손글씨 느낌의 선 (천천히 늘었다 줄었다)
  const g = 0.5+0.5*Math.sin(t*0.6);
  ctx.fillStyle='#4a6fb0';
  ctx.fillRect(x-s*1.5, y-s*1.0, s*2.6*g, s*0.12);
  ctx.fillRect(x-s*1.5, y-s*0.72, s*1.9, s*0.10);
  ctx.fillStyle='#c2553f';
  ctx.fillRect(x-s*1.5, y-s*0.44, s*2.2*g, s*0.10);
  ctx.fillStyle='#5a8a5a';
  ctx.fillRect(x-s*1.5, y-s*0.16, s*1.5, s*0.10);
}

function zoneBoxes(){
  ctx.save();
  const t = performance.now()/1000;
  const s = Math.max(10, Math.round(W/96));  // 가구 기본 단위

  // 구역 바닥 톤 — 카펫으로 영역을 구분(점선보다 사무실답다)
  const CARPET = {desk:'rgba(32,66,76,.62)', research:'rgba(30,74,60,.62)',
                  meeting:'rgba(58,52,84,.62)', server:'rgba(22,48,60,.68)',
                  lounge:'rgba(54,58,88,.60)', error:'rgba(86,36,36,.55)'};
  for(const [k,z] of Object.entries(Z)){
    if(k==='waiting') continue;
    ctx.fillStyle = CARPET[k] || 'rgba(40,60,66,.25)';
    ctx.fillRect(z.x, z.y, z.w, z.h);
    ctx.strokeStyle = 'rgba(31,217,192,.22)';
    ctx.setLineDash([6,6]); ctx.strokeRect(z.x,z.y,z.w,z.h); ctx.setLineDash([]);
  }

  // 구역 소품 — 사람이 앉지 않는 가장자리에만 놓는다(캐릭터에 안 가리게)
  const rz = Z.research;
  plantUnit(rz.x + rz.w*0.06, rz.y + rz.h*0.93, s*0.80);
  plantUnit(rz.x + rz.w*0.94, rz.y + rz.h*0.93, s*0.80);

  const m = Z.meeting;                    // 회의실 화이트보드는 맨 위 띠에
  boardUnit(m.x + m.w*0.5, m.y + s*0.9, s*0.62, t);

  const lg = Z.lounge;                    // 라운지 소파·정수기·화분
  sofaUnit(lg.x + lg.w*0.30, lg.y + lg.h*0.30, s*0.72);
  ctx.fillStyle='#8fd3e0'; ctx.fillRect(lg.x + lg.w*0.90, lg.y + lg.h*0.16, s*0.5, s*0.7);
  ctx.fillStyle='#cfd8dd'; ctx.fillRect(lg.x + lg.w*0.90, lg.y + lg.h*0.16 + s*0.7, s*0.5, s*0.6);
  plantUnit(lg.x + lg.w*0.06, lg.y + lg.h*0.88, s*0.80);

  // 버그존 — 경고 스트라이프 바닥
  const er = Z.error;
  ctx.save(); ctx.beginPath(); ctx.rect(er.x,er.y,er.w,er.h); ctx.clip();
  for(let i=-2;i<20;i++){
    ctx.fillStyle = i%2 ? 'rgba(200,70,60,.20)' : 'rgba(255,190,60,.14)';
    ctx.beginPath();
    ctx.moveTo(er.x+i*16, er.y); ctx.lineTo(er.x+i*16+16, er.y);
    ctx.lineTo(er.x+i*16+16-er.h, er.y+er.h); ctx.lineTo(er.x+i*16-er.h, er.y+er.h);
    ctx.fill();
  }
  ctx.restore();

  // 구역 이름표 — 가구 위에 얹히므로 배경 박스 필수
  ctx.font = `600 ${Math.max(11, Math.round(W/110))}px ui-monospace,monospace`;
  for(const [k,z] of Object.entries(Z)){
    if(k==='waiting') continue;
    const lw = ctx.measureText(z.label).width;
    ctx.fillStyle = 'rgba(7,23,26,.82)';
    ctx.fillRect(z.x+4, z.y+4, lw+10, 20);
    ctx.fillStyle = 'rgba(223,246,244,.72)';
    ctx.fillText(z.label, z.x+9, z.y+19);
  }
  ctx.restore();
}

// 자리 가구 — 앵커 전체에 깐다. 사람이 없어도 사무실은 사무실이어야 한다.
function drawAllFurniture(){
  const s = Math.max(10, Math.round(W/96)) * 0.76;
  const t = performance.now()/1000;
  ANCHORS.desk.forEach((a,i)   => deskUnit(a.x, a.y - s*3.60, s*0.92, i));
  ANCHORS.research.forEach((a,i)=> shelfUnit(a.x, a.y - s*3.40, s*0.62));
  ANCHORS.server.forEach((a,i) => rackUnit(a.x, a.y - s*2.55, s*0.72, t+i));
  // 회의실 — 긴 테이블 한 장 + 의자
  const m = Z.meeting;
  ctx.fillStyle='#6b5340';
  ctx.fillRect(m.x + m.w*0.14, m.y + m.h*0.52, m.w*0.72, s*0.34);
  ctx.fillStyle='#4c3a2c';
  ctx.fillRect(m.x + m.w*0.20, m.y + m.h*0.52 + s*0.34, s*0.18, s*0.55);
  ctx.fillRect(m.x + m.w*0.76, m.y + m.h*0.52 + s*0.34, s*0.18, s*0.55);
  ANCHORS.meeting.forEach(a=>{
    ctx.fillStyle='#2f333c';
    ctx.fillRect(a.x - s*0.34, a.y + s*0.62, s*0.68, s*0.18);
  });
}

function drawPerson(p, dt){
  // 걷기 보간 — 이벤트는 순간이지만 캐릭터는 걸어서 이동한다
  const dx = p.tx-p.x, dy = p.ty-p.y;
  const dist = Math.hypot(dx,dy);
  const moving = dist > 1.5;
  if(moving){
    const sp = Math.min(dist, 150*dt);
    p.x += dx/dist*sp; p.y += dy/dist*sp;
  }
  // 아이들 애니 — 정지 프레임 금지
  p.bob += dt*(moving?9:2.4);
  const bob = Math.sin(p.bob)*(moving?3.0:1.3);
  p.blink -= dt; if(p.blink<=0) p.blink = 2.2+Math.random()*2.6;
  const eyeOpen = p.blink>0.12;

  const u = Math.max(13, Math.round(W/88));   // 픽셀 단위 (캐릭터 존재감)
  const x = Math.round(p.x), y = Math.round(p.y+bob);
  // 유휴 — 자리는 그대로 두고 흐리게 + zzz. (라운지로 옮기지 않는다)
  ctx.globalAlpha = p.idle ? 0.55 : 1;
  const px = (a,b,w,h)=>ctx.fillRect(Math.round(x+a), Math.round(y+b), Math.ceil(w), Math.ceil(h));

  // 그림자
  ctx.fillStyle='rgba(0,0,0,.45)';
  ctx.beginPath(); ctx.ellipse(x, y+u*1.75, u*0.95, u*0.30, 0,0,6.3); ctx.fill();
  // 실루엣 분리 — 얇은 어두운 테두리만(검은 박스가 되면 안 된다)
  ctx.fillStyle='rgba(8,14,18,.85)';
  ctx.fillRect(Math.round(x-u*0.80), Math.round(y-u*1.20), Math.ceil(u*1.60), Math.ceil(u*0.10));
  ctx.fillRect(Math.round(x-u*0.80), Math.round(y-u*1.20), Math.ceil(u*0.10), Math.ceil(u*2.45));
  ctx.fillRect(Math.round(x+u*0.70), Math.round(y-u*1.20), Math.ceil(u*0.10), Math.ceil(u*2.45));
  ctx.fillRect(Math.round(x-u*0.80), Math.round(y+u*1.15), Math.ceil(u*1.60), Math.ceil(u*0.10));

  // 선택 표시 — 클릭한 직원 발밑에 링
  if(p.__sel){
    ctx.strokeStyle='rgba(255,224,0,.95)'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.ellipse(x, y+u*1.75, u*1.15, u*0.40, 0,0,6.3); ctx.stroke();
  }

  // ── 바람의나라식 치비 스프라이트 (큰 머리 · 작은 몸 · 2프레임 걷기) ──
  const SKIN='#f7d7b0', SKIN_S='#e0b489', HAIR='#2b2118', HAIR_S='#191310';
  const tunic = p.zone==='error' ? '#c8433a'
              : p.zone==='waiting' ? '#e8b93c'
              : p.tunic;
  const tunicS = shade(tunic, -28);
  const step = moving ? (Math.sin(p.bob*1.0)>0 ? 1 : -1) : 0;

  // 다리 (걸을 때 번갈아)
  ctx.fillStyle = '#3a3b46';
  px(-u*0.52, u*1.05 + (step>0? u*0.14:0), u*0.42, u*0.62);
  px( u*0.10, u*1.05 + (step<0? u*0.14:0), u*0.42, u*0.62);
  // 신발
  ctx.fillStyle = '#23242c';
  px(-u*0.56, u*1.58 + (step>0? u*0.14:0), u*0.50, u*0.20);
  px( u*0.06, u*1.58 + (step<0? u*0.14:0), u*0.50, u*0.20);

  // 몸통(저고리) — 아래로 살짝 넓어지는 실루엣
  ctx.fillStyle = tunicS; px(-u*0.72, u*0.20, u*1.44, u*0.92);
  ctx.fillStyle = tunic;  px(-u*0.66, u*0.16, u*1.32, u*0.80);
  // 옷깃 (한복 느낌 V)
  ctx.fillStyle = '#f4f1e8';
  px(-u*0.16, u*0.16, u*0.32, u*0.34);
  // 허리띠
  ctx.fillStyle = shade(tunic, -50); px(-u*0.68, u*0.84, u*1.36, u*0.18);

  // 팔 (걸을 때 반대로 흔들림 / 타이핑할 때 위아래)
  const swing = moving ? step*u*0.18 : (p.zone==='desk' ? Math.sin(p.bob*3)*u*0.14 : 0);
  ctx.fillStyle = tunicS;
  px(-u*0.94, u*0.26 - swing, u*0.30, u*0.62);
  px( u*0.64, u*0.26 + swing, u*0.30, u*0.62);
  ctx.fillStyle = SKIN;   // 손
  px(-u*0.94, u*0.84 - swing, u*0.30, u*0.24);
  px( u*0.64, u*0.84 + swing, u*0.30, u*0.24);

  // 머리 — 크게. 목은 짧게.
  ctx.fillStyle = SKIN_S; px(-u*0.76, -u*0.98, u*1.52, u*1.20);
  ctx.fillStyle = SKIN;   px(-u*0.70, -u*1.02, u*1.40, u*1.16);
  // 머리카락 (윗단 + 옆단 + 앞머리)
  ctx.fillStyle = HAIR_S; px(-u*0.80, -u*1.16, u*1.60, u*0.46);
  ctx.fillStyle = HAIR;   px(-u*0.74, -u*1.12, u*1.48, u*0.38);
  px(-u*0.80, -u*0.90, u*0.22, u*0.62);   // 왼쪽 귀밑머리
  px( u*0.58, -u*0.90, u*0.22, u*0.62);   // 오른쪽
  // 상투(위로 묶은 머리) — 개체 구분용 작은 포인트
  if(p.topknot){ ctx.fillStyle=HAIR; px(-u*0.16, -u*1.40, u*0.32, u*0.28); }

  // 눈 — 정면 2점. 방향 따라 살짝 이동.
  if(eyeOpen){
    ctx.fillStyle='#20160f';
    const ex = p.face>0 ? u*0.04 : -u*0.04;
    px(-u*0.40+ex, -u*0.62, u*0.20, u*0.26);
    px( u*0.20+ex, -u*0.62, u*0.20, u*0.26);
  } else {
    ctx.fillStyle='#20160f';
    px(-u*0.40, -u*0.52, u*0.20, u*0.08);
    px( u*0.20, -u*0.52, u*0.20, u*0.08);
  }
  // 볼 홍조
  ctx.fillStyle='rgba(226,130,110,.45)';
  px(-u*0.62, -u*0.40, u*0.20, u*0.14);
  px( u*0.42, -u*0.40, u*0.20, u*0.14);
  ctx.globalAlpha = 1;
  if(p.idle){
    const zt = performance.now()/700;
    ctx.fillStyle='rgba(160,200,210,.75)';
    ctx.font = `700 ${Math.round(u*0.9)}px sans-serif`;
    ctx.fillText('z', x+u*0.9, y-u*1.5 - Math.sin(zt)*u*0.25);
    ctx.font = `700 ${Math.round(u*0.65)}px sans-serif`;
    ctx.fillText('z', x+u*1.5, y-u*1.9 - Math.sin(zt+1)*u*0.25);
  }

  // 이름표 (이 화면의 핵심) — 겹치면 위로 비켜난다
  const fs = Math.max(10, Math.round(u*1.0));
  ctx.font = `700 ${fs}px "Pretendard","Malgun Gothic",sans-serif`;
  const label = p.name || '';
  const tw = ctx.measureText(label).width;
  const bw = tw+12, bh = fs+8;
  let bx = x-bw/2, by = y+u*2.05;
  for(let tries=0; tries<6; tries++){
    const hit = labelBoxes.some(b =>
      bx < b.x+b.w+3 && bx+bw+3 > b.x && by < b.y+b.h+2 && by+bh+2 > b.y);
    if(!hit) break;
    by += bh+3;   // 아래로 비켜난다
  }
  labelBoxes.push({x:bx, y:by, w:bw, h:bh});
  ctx.fillStyle='rgba(6,20,23,.90)';
  ctx.fillRect(bx, by, bw, bh);
  ctx.strokeStyle='rgba(31,217,192,.55)'; ctx.lineWidth=1;
  ctx.strokeRect(bx, by, bw, bh);
  // 이름표가 멀어졌으면 캐릭터와 잇는 실선
  if(by > y+u*2.4){
    ctx.strokeStyle='rgba(31,217,192,.28)';
    ctx.beginPath(); ctx.moveTo(x, y+u*1.9); ctx.lineTo(x, by); ctx.stroke();
  }
  ctx.fillStyle='#dff6f4'; ctx.textAlign='left';
  ctx.fillText(label, bx+6, by+fs+1);

  // 상태 이펙트
  if(p.zone==='waiting'){
    const s = Math.sin(performance.now()/220)>0 ? 1 : .25;
    ctx.globalAlpha=s; ctx.fillStyle='#ffd34d';
    ctx.font=`900 ${u*1.6}px sans-serif`; ctx.fillText('?', x+u*1.2, y-u*1.6);
    ctx.globalAlpha=1;
  } else if(p.zone==='research'){
    ctx.strokeStyle='#7ce7ff'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(x+u*1.35, y-u*1.5, u*0.42, 0, 6.3); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x+u*1.65,y-u*1.2); ctx.lineTo(x+u*2.0,y-u*0.85); ctx.stroke();
  } else if(p.zone==='desk' && !moving){
    // 타이핑 표시 — 이름표와 겹치지 않게 캐릭터 옆 허리 높이에
    const k = Math.floor(performance.now()/300)%4;
    ctx.fillStyle='rgba(223,246,244,.75)';
    for(let i=0;i<3;i++) ctx.fillRect(x+u*1.15+i*u*0.40, y+u*0.25, u*0.24, u*0.24*(i<=k?1:0.35));
  }
}

function getCss(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

// 저고리 색 팔레트 — 바람의나라풍 채도 낮은 전통색
const TUNICS = ['#3f6fa8','#7a4a86','#2f8a6d','#b3603a','#5a6bb5','#8a3f4f',
                '#3e8fa0','#7b6a2e','#5b7a3a','#a05a86','#46608e','#8c5a2b'];
function tunicFor(name){
  let h = 0;
  for(let i=0;i<name.length;i++) h = (h*31 + name.charCodeAt(i)) >>> 0;
  return TUNICS[h % TUNICS.length];
}
function shade(hex, d){
  const n = parseInt(hex.slice(1),16);
  const cl = v => Math.max(0, Math.min(255, v+d));
  return '#' + [cl(n>>16&255), cl(n>>8&255), cl(n&255)]
    .map(v=>v.toString(16).padStart(2,'0')).join('');
}

let last = performance.now();
let labelBoxes = [];
function frame(now){
  const dt = Math.min(.05, (now-last)/1000); last = now;
  roomBg(); lightPools(); zoneBoxes();
  labelBoxes = [];
  for(const [id,pp] of people) pp.__sel = (id===selectedId);
  const arr = [...people.values()].sort((a,b)=>a.y-b.y);
  drawAllFurniture();                    // 가구 먼저 (사람 뒤에 놓이게)
  for(const p of arr) drawPerson(p, dt);
  // 타임코드
  const t = Math.floor((now-T0)/1000);
  document.getElementById('tc').textContent =
    [t/3600|0, (t/60|0)%60, t%60].map(n=>String(n|0).padStart(2,'0')).join(':');
  document.getElementById('ticker').innerHTML = logLines.join('<br>');
  requestAnimationFrame(frame);
}
resize(); requestAnimationFrame(frame);

// 키 c = CCTV 강도 토글 (촬영용: 도입부 hi, 튜토리얼 본문 lo)
addEventListener('keydown', e=>{
  if(e.key==='c') document.body.dataset.cctv = document.body.dataset.cctv==='hi'?'lo':'hi';
  if(e.key==='Escape') closeCard();
});

// ── 직원 카드 — 캐릭터를 클릭하면 무슨 일을 하는 사람인지 보여준다 ──
let roles = {};   // name -> {description, file, zone}
fetch('/org',{cache:'no-store'}).then(r=>r.json()).then(o=>{
  for(const a of (o.agents||[])) roles[a.name] = a;
}).catch(()=>{});

const ZONE_DOING = {
  desk:'책상에서 파일을 쓰거나 고치는 중', research:'리서치 코너에서 찾아보는 중',
  meeting:'회의실에서 다른 직원과 일하는 중', server:'서버랙에서 배포·커밋 중',
  lounge:'라운지에서 대기 중', waiting:'★ 손 들고 승인을 기다리는 중',
  error:'버그존 — 방금 실패한 작업이 있음'
};
let selectedId = null;

function closeCard(){ selectedId = null; document.getElementById('card').hidden = true; }
document.getElementById('cardX').onclick = closeCard;

cv.addEventListener('click', e=>{
  const r = cv.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  const u = Math.max(13, Math.round(W/88));
  let hit = null, best = 1e9;
  for(const [id,p] of people){
    // 캐릭터 몸통+머리 대략 박스
    const dx = Math.abs(mx - p.x), dy = my - (p.y - u*0.6);
    if(dx < u*1.1 && dy > -u*1.2 && dy < u*2.4){
      const d = dx + Math.abs(dy);
      if(d < best){ best = d; hit = id; }
    }
  }
  if(hit){ selectedId = hit; renderCard(); } else closeCard();
});

function renderCard(){
  const p = people.get(selectedId);
  if(!p){ closeCard(); return; }
  const meta = roles[p.name] || {};
  document.getElementById('card').hidden = false;
  document.getElementById('cName').textContent = p.name;
  document.getElementById('cRole').textContent =
    meta.description || '(이 에이전트 파일에 설명이 없습니다 — 한 줄 써두면 여기 뜹니다)';
  document.getElementById('cNow').textContent =
    (ZONE_DOING[p.zone] || p.zone) + (p.tool ? ` · ${p.tool}` : '');
  document.getElementById('cZone').textContent = (ZONES[p.zone]||{}).label || p.zone;
  document.getElementById('cFile').textContent =
    meta.file ? meta.file.replace(/\\/g,'/').split('/').slice(-3).join('/') : '—';
}
</script>
